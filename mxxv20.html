@media (max-width: 900px){
  html,body{

  }

    width:100%;
    height:100dvh;

    grid-template-rows:60px minmax(0,1fr) auto;
    overflow:hidden;
  }
  .shell.inchat .sidebar{display:none}
  .shell.inchat .main{display:grid}

  /* Telegram-like top bar */
  .top{
    flex:0 0 auto;
    height:calc(58px + env(safe-area-inset-top));
    min-height:calc(58px + env(safe-area-inset-top));

  .search{

    min-height:58px;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    background:var(--panel);

  .chathead{
    width:100%;
    height:60px;
    min-height:60px;
    flex:0 0 60px;
    padding:6px 9px;
    position:relative;
    z-index:10;

  .chathead .sub{font-size:11px}

  .messages{
    width:100%;

    height:auto!important;
    flex:1 1 auto;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    touch-action:pan-y;
    padding:14px 10px 14px;
    gap:6px;
    scroll-behavior:auto;

  .bubble{
    max-width:82%;
    padding:9px 12px 7px;
    border-radius:17px;
    font-size:16px;
  }
  .bubble.mine{border-bottom-right-radius:5px}
  .bubble:not(.mine){border-bottom-left-radius:5px}

  .composer{
    width:100%;
    min-height:60px;
    flex:0 0 auto;

    display:flex;
    align-items:center;

    min-width:82px;
    padding:0 15px;
    border-radius:22px;
    font-size:15px;
  }

  /* Don't let the browser/page itself steal the gesture */
  .drawer,.overlay{overscroll-behavior:contain}
  .drawerbox{
    width:min(320px,88vw);
    padding-top:calc(16px + env(safe-area-inset-top));
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
  }

  /* Login also fills the phone naturally */
  .auth{
    width:calc(100% - 28px);
    max-width:430px;
    margin:0 auto;
    border-radius:24px;
    padding:24px;
  }
}

function roomMessageCollection(x){return collection(db,...(x.type==='chat'?['chats',x.id,'messages']:x.type==='group'?['groups',x.id,'messages']:['channels',x.id,'posts']))}
function readKey(x){return `${x.type}_${x.id}`}
function readAtFor(x){return Number(profile?.readAt?.[readKey(x)]||0)}
async function markRoomRead(x){
  if(!user||!x)return;
  const now=Date.now();
  const key=readKey(x);
  profile={...profile,readAt:{...(profile?.readAt||{}),[key]:now}};
  try{
    // Update only this room's read timestamp; do not erase other rooms.
    try{await updateDoc(doc(db,'users',user.uid),{[`readAt.${key}`]:now})}catch(e){await setDoc(doc(db,'users',user.uid),{uid:user.uid,readAt:{[key]:now}},{merge:true})}
  }catch(e){console.warn('read state:',e)}
}
async function unreadCount(x){
  const since=readAtFor(x);
  if(!user||!x)return 0;
  try{
    const ref=roomMessageCollection(x);
    let snap;
    if(since>0){
      const {Timestamp}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
      snap=await getDocs(query(ref,where('createdAt','>',Timestamp.fromMillis(since))));
    }else{
      snap=await getDocs(ref);
    }
    let n=0;
    snap.forEach(d=>{
      const m=d.data()||{};
      const sender=m.senderId||m.uid||m.from;
      if(sender===user.uid)return;
      const t=messageTime(m);
      // Legacy messages without a timestamp are only counted on first load.
      if((since===0 && !t) || t>since)n++;
    });
    return n;
  }catch(e){
    // Fallback for older messages / query issues.
    try{
      const snap=await getDocs(roomMessageCollection(x));
      let n=0;
      snap.forEach(d=>{
        const m=d.data()||{},sender=m.senderId||m.uid||m.from,t=messageTime(m);
        if(sender!==user.uid && t>since)n++;
      });
      return n;
    }catch(_){return 0}
  }
}
async function loadUnreadCounts(arr){
  if(!arr.length||!user||unreadBusy)return;
  unreadBusy=true;
  try{
    const counts=await Promise.all(arr.map(async x=>[readKey(x),await unreadCount(x)]));
    const map=Object.fromEntries(counts);
    records=records.map(x=>({...x,unread:map[readKey(x)]||0}));
    const search=$('search')?.value||'';
    const q=search.trim().toLowerCase();
    const filtered=q?records.filter(x=>x.title.toLowerCase().includes(q)||x.subtitle.toLowerCase().includes(q)):records;
    drawList(filtered);
  }finally{unreadBusy=false}
}
function startUnreadPolling(){

function setRoomHidden(keys){

function filterList(v){const s=v.trim().toLowerCase();drawList(!s?records:records.filter(x=>x.title.toLowerCase().includes(s)||x.subtitle.toLowerCase().includes(s)))}
function normalizeUsername(v=""){
  return String(v).trim().replace(/^@+/,'').toLowerCase();
}
function validUsername(v){return /^[a-z0-9_]{3,32}$/.test(v)}
async function resolveUsername(raw){
  const val=normalizeUsername(raw);
  if(!validUsername(val)) return null;
  const registryRef=doc(db,'usernames',val);
  const direct=await getDoc(registryRef);
  if(direct.exists()){
    const x=direct.data()||{};
    if(x.type==='user' && x.uid){
      const pr=await getDoc(doc(db,'users',x.uid));
      if(pr.exists()){
        const p=pr.data()||{};
        if(normalizeUsername(p.username)===val) return {kind:'user',uid:x.uid,profile:p,source:'index'};
      }
    }
    if(x.type==='channel' && x.uid && (x.roomType==='group'||x.roomType==='channel')){
      const col=x.roomType==='group'?'groups':'channels';
      const room=await getDoc(doc(db,col,x.uid));
      if(room.exists() && normalizeUsername(room.data()?.username)===val)
        return {kind:'room',uid:x.uid,roomType:x.roomType,room:room.data(),source:'index'};
    }
  }
  // Legacy/fallback search: even if the usernames index is missing or old,
  // an actually saved username can still be found.
  const uq=await getDocs(query(collection(db,'users'),where('username','==',val),limit(5)));
  for(const d of uq.docs){
    const p=d.data()||{};
    if(p.uid && normalizeUsername(p.username)===val)
      return {kind:'user',uid:p.uid,profile:p,source:'users'};
  }
  const iq=await getDocs(query(collection(db,'usernames'),where('username','==',val),limit(5)));
  for(const d of iq.docs){
    const x=d.data()||{};
    if(x.type==='user' && x.uid){
      const pr=await getDoc(doc(db,'users',x.uid));
      if(pr.exists() && normalizeUsername(pr.data()?.username)===val)
        return {kind:'user',uid:x.uid,profile:pr.data(),source:'index-query'};
    }
  }
  for(const [col,roomType] of [['groups','group'],['channels','channel']]){
    const rq=await getDocs(query(collection(db,col),where('username','==',val),limit(5)));
    for(const d of rq.docs){
      const room=d.data()||{};
      if(normalizeUsername(room.username)===val)
        return {kind:'room',uid:d.id,roomType,room,source:'rooms'};
    }
  }
  return null;
}
async function searchUsers(initial=''){
  showModal(`<h2>Foydalanuvchi qidirish</h2><div class="field"><input id="findUser" placeholder="@username" value="${esc(initial)}" autocomplete="off"></div><div id="found" class="empty">Username yozing — mavjud foydalanuvchi, guruh yoki kanal chiqadi.</div><div class="actions"><button id="closeSearch">Yopish</button><button class="solid" id="doFind">Qidirish</button></div>`);
  $("closeSearch").onclick=closeModal;
  $("doFind").onclick=findUser;
  const input=$("findUser");let timer=null;
  input.oninput=()=>{clearTimeout(timer);timer=setTimeout(findUser,250)};
  input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(timer);findUser()}};
  if(initial.trim())findUser();
  input.focus();
}
async function findUser(){
  const val=normalizeUsername($("findUser").value),out=$("found");
  if(!val){out.textContent='Username kiriting.';return}
  if(!validUsername(val)){
    out.textContent='Username 3–32 belgidan iborat bo‘lsin: faqat a–z, 0–9 va _.';
    return;
  }
  out.textContent='Qidirilmoqda...';
  try{
    const result=await resolveUsername(val);
    if(!result){out.textContent='Bunday username topilmadi.';return}

    if(result.kind==='user'){
      const p=result.profile||{};
      if(result.uid===user.uid){
        out.innerHTML=`<div class="item" style="cursor:default"><div class="avatar">${initials(p.name||val)}</div><div class="meta"><div class="name">${esc(p.name||'Foydalanuvchi')}</div><div class="sub">@${esc(val)} · Bu siz</div></div></div>`;
        return;
      }
      out.innerHTML=`<div class="item" style="cursor:default"><div class="avatar">${initials(p.name||val)}</div><div class="meta"><div class="name">${esc(p.name||'Foydalanuvchi')}</div><div class="sub">@${esc(val)}</div></div><button class="send" id="messageUser">Yozish</button></div>`;
      $("messageUser").onclick=e=>{e.stopPropagation();startChat(p)};
      return;
    }

    const room=result.room||{};
    const joined=(room[result.roomType==='group'?'memberIds':'subscriberIds']||[]).includes(user.uid);
    const kind=result.roomType==='group'?'Guruh':'Kanal';
    out.innerHTML=`<div class="item" style="cursor:default"><div class="avatar">${initials(room.name||val)}</div><div class="meta"><div class="name">${esc(room.name||kind)}</div><div class="sub">@${esc(val)} · ${kind}</div></div><button class="send" id="joinRoomBtn" ${joined?'disabled':''}>${joined?'Qo‘shilgan':'Qo‘shilish'}</button></div><div id="joinErr" class="error"></div>`;
    $("joinRoomBtn").onclick=async()=>{
      const btn=$("joinRoomBtn"),err=$("joinErr");
      btn.disabled=true;btn.textContent='Qo‘shilmoqda...';
      try{
        const col=result.roomType==='group'?'groups':'channels';
        const field=result.roomType==='group'?'memberIds':'subscriberIds';
        const ref=doc(db,col,result.uid);
        await runTransaction(db,async tx=>{
          const snap=await tx.get(ref);
          if(!snap.exists())throw new Error(`${kind} topilmadi.`);
          const data=snap.data()||{},old=Array.isArray(data[field])?data[field]:[];
          if(old.includes(user.uid))return;
          tx.update(ref,{[field]:[...old,user.uid],updatedAt:serverTimestamp()});
        });
        tab=result.roomType==='group'?'groups':'channels';
        current={id:result.uid,type:result.roomType,title:room.name||kind,subtitle:room.description||kind,admin:(room.admins||[]).includes(user.uid)};
        closeModal();
        renderApp();
        toast(kind+'ga qo‘shildingiz');
      }catch(e){
        btn.disabled=false;btn.textContent='Qo‘shilish';
        err.textContent='Qo‘shib bo‘lmadi: '+(e?.message||e);
      }
    };
  }catch(e){out.textContent='Qidirishda xatolik: '+(e?.message||e)}
}

function chatId(a,b){return [a,b].sort().join('_')}async function startChat(p){try{const id=chatId(user.uid,p.uid),ref=doc(db,'chats',id);await setDoc(ref,{participants:[user.uid,p.uid],lastMessage:'',updatedAt:serverTimestamp()},{merge:true});closeModal();current={id,type:'chat',title:p.name,subtitle:'Shaxsiy suhbat',other:p.uid};tab='all';renderApp();setTimeout(()=>$("message")?.focus(),100)}catch(e){toast('Chat ochilmadi: '+e.message)}}async function openRoom(x){
  current={...x};
  if(x.type==='chat')current.other=x.other;
  await markRoomRead(x);
  current.unread=0;
  renderApp();
}
function messageTime(m){
  const v=m.createdAt||m.timestamp||m.sentAt||m.time;
  if(v?.toMillis)return v.toMillis();
  if(v?.toDate)return v.toDate().getTime();
  if(typeof v==='number')return v;
  if(typeof v==='string'){const n=Date.parse(v);return Number.isNaN(n)?0:n}
  return 0;
}
function messageText(m){
  return m.text ?? m.message ?? m.content ?? m.body ?? '';
}
function subscribeMessages(){
  if(unsub)unsub();
  firstMessageLoad=true;
  const c=current;
  const path=c.type==='chat'?['chats',c.id,'messages']:c.type==='group'?['groups',c.id,'messages']:['channels',c.id,'posts'];
  const ref=collection(db,...path);
  let messageMap=new Map();

  const render=()=>{
    const box=$("messages");
    if(!box)return;
    const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<140;
    const oldHeight=box.scrollHeight,oldTop=box.scrollTop;
    const arr=Array.from(messageMap.values()).sort((a,b)=>messageTime(a.data)-messageTime(b.data));

    box.innerHTML='';
    arr.forEach(({id,data:m})=>{
      const mine=m.senderId===user.uid || m.uid===user.uid || m.from===user.uid;
      const div=document.createElement('div');
      div.className='bubble'+(mine?' mine':'');
      div.dataset.id=id;
      const sender=m.senderName||m.sender||m.name||'';
      const tm=messageTime(m);
      const time=tm?new Date(tm).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'}):'';
      div.innerHTML=`${
        c.type!=='chat'
        ? `<div class="sender">${esc(mine?(profile?.name||'Siz'):(sender||'Foydalanuvchi'))}</div>`
        : ''
      }<div>${esc(messageText(m))}</div><div class="time">${time}</div>${
        mine?`<button class="deleteMsg" title="O‘chirish">O‘chirish</button>`:''
      }`;
      box.appendChild(div);
      if(mine)div.querySelector('.deleteMsg').onclick=()=>deleteMessage(id);
    });

    if(firstMessageLoad){
      box.scrollTop=box.scrollHeight;
      firstMessageLoad=false;
    }else if(nearBottom){
      box.scrollTop=box.scrollHeight;
    }else{
      box.scrollTop=Math.max(0,oldTop+(box.scrollHeight-oldHeight));
    }
  };

  // No orderBy is used here. This makes old messages visible even if some
  // legacy documents don't have a createdAt field.
  unsub=onSnapshot(ref,snap=>{
    messageMap.clear();
    snap.docs.forEach(d=>messageMap.set(d.id,{id:d.id,data:d.data()}));
    render();
  },e=>toast('Yozishmalar yuklanmadi: '+e.message));

  setTimeout(()=>{
    const box=$("messages");
    if(box)box.onscroll=()=>{};
  },0);
}

async function deleteMessage(id){if(!confirm('Xabarni o‘chirasizmi?'))return;try{const c=current,path=c.type==='chat'?['chats',c.id,'messages',id]:c.type==='group'?['groups',c.id,'messages',id]:['channels',c.id,'posts',id];await deleteDoc(doc(db,...path))}catch(e){toast('O‘chirilmadi: '+e.message)}}
async function sendMessage(e){e.preventDefault();const input=$("message"),text=input.value.trim();if(!text)return;const c=current;input.disabled=true;try{const path=c.type==='chat'?['chats',c.id,'messages']:c.type==='group'?['groups',c.id,'messages']:['channels',c.id,'posts'];await addDoc(collection(db,...path),{senderId:user.uid,senderName:profile.name,text,createdAt:serverTimestamp()});if(c.type==='chat')await updateDoc(doc(db,'chats',c.id),{lastMessage:text,updatedAt:serverTimestamp()});else await updateDoc(doc(db,c.type==='group'?'groups':'channels',c.id),{updatedAt:serverTimestamp()});input.value=''}catch(err){toast('Xabar yuborilmadi: '+err.message)}finally{input.disabled=false;input.focus()}}
function profileModal(){showModal(`<div class="profilePage"><div class="profileHero"><button class="iconbtn" id="profileClose">‹</button><div class="avatar profileAvatar">${initials(profile?.name||'Men')}</div><h2>${esc(profile?.name||'Foydalanuvchi')}</h2><div class="profileOnline">● onlayn</div><div class="profileId">id: ${esc(user?.uid||'')}</div></div><div class="profileActions"><button id="editMyProfile">✎<span>Axborotni tahrirlash</span></button><button id="mySettings">⚙<span>Sozlamalar</span></button></div><div class="profileCard"><div class="profileValue">@${esc(profile?.username||'')}</div><div class="sub">Foydalanuvchi nomi</div><div class="profileValue">${esc(profile?.bio||'Tarjimai hol kiritilmagan')}</div><div class="sub">Tarjimai hol</div></div></div>`);$('profileClose').onclick=closeModal;$('editMyProfile').onclick=()=>editProfileModal();$('mySettings').onclick=()=>{closeModal();$('drawer').classList.add('show')}}
function editProfileModal(){showModal(`<h2>Profilni tahrirlash</h2><div class="field"><label>Ism</label><input id="pName" value="${esc(profile.name||'')}"></div><div class="field"><label>Username (ixtiyoriy)</label><input id="pUser" value="${esc(profile.username||'')}"></div><div class="field"><label>Tarjimai hol</label><textarea id="pBio" rows="3">${esc(profile.bio||'')}</textarea></div><div class="actions"><button id="cancelP">Bekor qilish</button><button class="solid" id="saveP">Saqlash</button></div><div id="pErr" class="error"></div>`);$('cancelP').onclick=closeModal;$('saveP').onclick=saveProfile}
async function saveProfile(){
  const name=$("pName").value.trim(),username=normalizeUsername($("pUser").value),bio=$("pBio").value.trim(),err=$("pErr");
  err.textContent='';
  if(!name){err.textContent='Ismni kiriting.';return}
  if(username&&!validUsername(username)){err.textContent='Username 3–32 belgidan iborat bo‘lsin: faqat a–z, 0–9 va _.';return}
  const btn=$("saveP");if(btn){btn.disabled=true;btn.textContent='Saqlanmoqda...'}
  try{
    const oldUsername=normalizeUsername(profile?.username);
    await runTransaction(db,async tx=>{
      const userRef=doc(db,'users',user.uid);
      const newRef=username?doc(db,'usernames',username):null;
      const oldRef=oldUsername?doc(db,'usernames',oldUsername):null;
      let existing=null;
      if(newRef)existing=await tx.get(newRef);
      if(existing?.exists() && existing.data()?.uid!==user.uid)throw new Error('Bu username band.');
      tx.set(userRef,{uid:user.uid,name,username,bio},{merge:true});
      if(username)tx.set(newRef,{uid:user.uid,username,type:'user'});
      if(oldUsername&&oldUsername!==username)tx.delete(oldRef);
      if(!username&&oldUsername)tx.delete(oldRef);
    });
    profile={...profile,uid:user.uid,name,username,bio};closeModal();renderApp();toast('Profil saqlandi');
  }catch(e){console.error(e);err.textContent='Saqlashda xatolik: '+(e?.message||e)}
  finally{if(btn){btn.disabled=false;btn.textContent='Saqlash'}}
}

async function createRoom(type){
  showModal(`<h2>${type==='group'?'Guruh':'Kanal'} yaratish</h2><div class="field"><label>Nomi</label><input id="roomName" placeholder="Nomi"></div><div class="field"><label>Username (ixtiyoriy)</label><input id="roomUser" placeholder="masalan_mxx"></div><div class="field"><label>Tavsif</label><textarea id="roomDesc" rows="3"></textarea></div><div class="actions"><button id="cancelRoom">Bekor qilish</button><button class="solid" id="makeRoom">Yaratish</button></div><div id="roomErr" class="error"></div>`);
  $("cancelRoom").onclick=closeModal;
  $("makeRoom").onclick=async()=>{
    const name=$("roomName").value.trim(),username=normalizeUsername($("roomUser").value),description=$("roomDesc").value.trim(),err=$("roomErr"),btn=$("makeRoom");
    if(!name){err.textContent='Nom kiriting.';return}
    if(username&&!validUsername(username)){err.textContent='Username 3–32 belgidan iborat bo‘lsin: faqat a–z, 0–9 va _.';return}
    btn.disabled=true;btn.textContent='Yaratilmoqda...';
    try{
      const col=type==='group'?'groups':'channels';
      const data=type==='group'?{name,username:'',description,ownerId:user.uid,memberIds:[user.uid],admins:[user.uid],createdAt:serverTimestamp(),updatedAt:serverTimestamp()}:{name,username:'',description,ownerId:user.uid,subscriberIds:[user.uid],admins:[user.uid],createdAt:serverTimestamp(),updatedAt:serverTimestamp()};
      const roomRef=doc(collection(db,col));
      await setDoc(roomRef,data);
      if(username){
        const indexRef=doc(db,'usernames',username);
        try{
          await runTransaction(db,async tx=>{
            const indexSnap=await tx.get(indexRef);
            if(indexSnap.exists())throw new Error('Bu username band. Boshqa username tanlang.');
            tx.set(indexRef,{uid:roomRef.id,type:'channel',roomType:type,username});
            tx.update(roomRef,{username,updatedAt:serverTimestamp()});
          });
        }catch(e){
          try{await deleteDoc(roomRef)}catch(_){ }
          throw e;
        }
      }
      closeModal();tab=type==='group'?'groups':'channels';current={id:roomRef.id,type,title:name,subtitle:description,admin:true};renderApp();toast(type==='group'?'Guruh yaratildi':'Kanal yaratildi');
    }catch(e){err.textContent=e?.message||String(e);btn.disabled=false;btn.textContent='Yaratish'}
  };
}

async function roomInfo(){const c=current;if(c.type==='chat'){const p=(await getDoc(doc(db,'users',c.other))).data()||{};showModal(`<div class="profilePage"><div class="profileHero"><button class="iconbtn" id="x">‹</button><div class="avatar profileAvatar">${initials(p.name)}</div><h2>${esc(p.name||'Foydalanuvchi')}</h2><div class="profileOnline">● onlayn</div><div class="profileId">id: ${esc(p.uid||c.other)}</div></div><div class="profileActions"><button id="writeFromProfile">💬<span>Xabar</span></button><button id="muteFromProfile">🔕<span>Sukut qilish</span></button><button id="callInfo">☎<span>Chaqiruv</span></button><button id="videoInfo">▣<span>Video</span></button></div><div class="profileCard"><div class="profileValue">@${esc(p.username||'')}</div><div class="sub">Foydalanuvchi nomi</div><div class="profileValue">${esc(p.bio||'Tarjimai hol kiritilmagan')}</div><div class="sub">Tarjimai hol</div></div></div>`);$('x').onclick=closeModal;$('writeFromProfile').onclick=closeModal;return}
const col=c.type==='group'?'groups':'channels',d=(await getDoc(doc(db,col,c.id))).data()||{},can=d.ownerId===user.uid||d.admins?.includes(user.uid),members=c.type==='group'?(d.memberIds||[]):(d.subscriberIds||[]);showModal(`<div class="profilePage"><div class="profileHero"><button class="iconbtn" id="x">‹</button><div class="avatar profileAvatar">${initials(d.name||c.title)}</div><h2>${esc(d.name||c.title)}</h2><div class="profileOnline">${c.type==='group'?'Guruh':'Kanal'}</div><div class="profileId">${members.length} ${c.type==='group'?'a’zo':'obunachi'}</div></div><div class="profileCard"><div class="profileValue">@${esc(d.username||'')}</div><div class="sub">Username</div><div class="profileValue">${esc(d.description||'Tavsif kiritilmagan')}</div><div class="sub">Tavsif</div></div>${can?`<div class="actions"><button class="solid" id="addMemberBtn">＋ A’zo qo‘shish</button><button id="editRoomBtn">✎ Tahrirlash</button></div>`:''}<div class="sub" style="margin-top:12px">${c.type==='group'?'Guruh a’zolari':'Kanal obunachilari'}: ${members.length}</div></div>`);$('x').onclick=closeModal;if(can){$('addMemberBtn').onclick=()=>addRoomMember(c);$('editRoomBtn').onclick=()=>editRoomModal(c,d,col)}}

async function addRoomMember(c){
  const title=c.type==='group'?'Guruhga a’zo qo‘shish':'Kanalga obunachi qo‘shish';
  showModal(`<h2>${title}</h2><div class="field"><label>Username orqali qidirish</label><input id="memberUser" placeholder="@username" autocomplete="off"></div><div id="memberFound" class="empty">Username yozing — foydalanuvchi shu yerda chiqadi.</div><div id="memberErr" class="error"></div><div class="actions"><button id="memberCancel">Yopish</button></div>`);
  $('memberCancel').onclick=closeModal;
  const input=$('memberUser'),found=$('memberFound');let timer=null;
  async function findMember(){
    const un=normalizeUsername(input.value);
    if(!un){found.className='empty';found.textContent='Username yozing — foydalanuvchi shu yerda chiqadi.';return}
    if(!validUsername(un)){found.className='empty';found.textContent='Username 3–32 belgidan iborat bo‘lsin.';return}
    found.className='empty';found.textContent='Qidirilmoqda...';
    try{
      const result=await resolveUsername(un);
      if(!result||result.kind!=='user'){found.textContent='Bunday foydalanuvchi username topilmadi.';return}
      const uid=result.uid;
      if(uid===user.uid){found.textContent='O‘zingizni qo‘sha olmaysiz.';return}
      const p=result.profile||{};
      const col=c.type==='group'?'groups':'channels',field=c.type==='group'?'memberIds':'subscriberIds';
      const roomSnap=await getDoc(doc(db,col,c.id));
      if(!roomSnap.exists()){found.textContent='Guruh yoki kanal topilmadi.';return}
      const room=roomSnap.data()||{},already=(room[field]||[]).includes(uid);
      found.className='';
      found.innerHTML=`<div class="item" style="padding:10px 0;cursor:default"><div class="avatar">${initials(p.name||un)}</div><div class="meta"><div class="name">${esc(p.name||'Foydalanuvchi')}</div><div class="sub">@${esc(normalizeUsername(p.username)||un)}</div></div><button class="send" id="addFoundUser" ${already?'disabled':''}>${already?'Qo‘shilgan':'Qo‘shish'}</button></div>`;
      $('addFoundUser').onclick=async()=>{
        const btn=$('addFoundUser'),err=$('memberErr');btn.disabled=true;btn.textContent='Qo‘shilmoqda...';err.textContent='';
        try{
          const ref=doc(db,col,c.id);
          await runTransaction(db,async tx=>{
            const snap=await tx.get(ref);
            if(!snap.exists())throw new Error('Guruh yoki kanal topilmadi.');
            const data=snap.data()||{},old=Array.isArray(data[field])?data[field]:[];
            if(old.includes(uid))return;
            tx.update(ref,{[field]:[...old,uid],updatedAt:serverTimestamp()});
          });
          btn.textContent='Qo‘shildi ✓';toast(`@${un} qo‘shildi`);
        }catch(e){btn.disabled=false;btn.textContent='Qo‘shish';err.textContent='Qo‘shib bo‘lmadi: '+(e?.message||e)}
      };
    }catch(e){found.className='empty';found.textContent='Qidirishda xatolik: '+(e?.message||e)}
  }
  input.oninput=()=>{clearTimeout(timer);timer=setTimeout(findMember,250)};
  input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(timer);findMember()}};
  input.focus();
}

function editRoomModal(c,d,col){
  showModal(`<h2>${c.type==='group'?'Guruhni':'Kanalni'} tahrirlash</h2><div class="field"><label>Nomi</label><input id="editRoomName" value="${esc(d.name||'')}"></div><div class="field"><label>Username</label><input id="editRoomUser" value="${esc(d.username||'')}"></div><div class="field"><label>Tavsif</label><textarea id="editRoomDesc" rows="3">${esc(d.description||'')}</textarea></div><div class="actions"><button id="editCancel">Bekor qilish</button><button class="solid" id="editSave">Saqlash</button></div><div id="editErr" class="error"></div>`);
  $('editCancel').onclick=closeModal;
  $('editSave').onclick=async()=>{
    const name=$('editRoomName').value.trim(),username=normalizeUsername($('editRoomUser').value),description=$('editRoomDesc').value.trim(),err=$('editErr'),btn=$('editSave'),oldUsername=normalizeUsername(d.username);
    if(!name){err.textContent='Nom kiriting.';return}
    if(username&&!validUsername(username)){err.textContent='Username 3–32 belgidan iborat bo‘lsin.';return}
    btn.disabled=true;btn.textContent='Saqlanmoqda...';
    try{
      const roomRef=doc(db,col,c.id),newIndex=username?doc(db,'usernames',username):null,oldIndex=oldUsername?doc(db,'usernames',oldUsername):null;
      await runTransaction(db,async tx=>{
        if(newIndex){
          const existing=await tx.get(newIndex);
          if(existing.exists()&&existing.data()?.uid!==c.id)throw new Error('Bu username band. Boshqa username tanlang.');
        }
        tx.update(roomRef,{name,username,description,updatedAt:serverTimestamp()});
        if(username)tx.set(newIndex,{uid:c.id,type:'channel',roomType:c.type,username});
        if(oldUsername&&oldUsername!==username)tx.delete(oldIndex);
      });
      c.title=name;c.subtitle=description;closeModal();renderApp();toast('Ma’lumotlar saqlandi');
    }catch(e){err.textContent=e?.message||String(e)}finally{btn.disabled=false;btn.textContent='Saqlash'}
  };
}

async function boot(){try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);if(localStorage.getItem('mxxDark')==='true')document.body.classList.add('dark');onAuthStateChanged(auth,async u=>{try{user=u;if(!u){stopUnreadPolling();profile=null;current=null;hideLoading();authScreen();return}profile=await loadProfile(u);hideLoading();renderApp()}catch(e){hideLoading();$("app").innerHTML=`<div class="auth"><h2>Profil yuklanmadi</h2><p class="error">${esc(e.message)}</p><button class="primary" onclick="location.reload()">Qayta urinish</button></div>`}})}catch(e){hideLoading();$("app").innerHTML=`<div class="auth"><h2>Xatolik</h2><p class="error">${esc(e.message)}</p></div>`}}boot();
</script></body></html>
